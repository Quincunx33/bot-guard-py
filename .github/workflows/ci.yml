name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests · Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run test suite
        run: python -m pytest -q
      - name: Compile package and examples
        run: python -m compileall -q bot_guard examples

  browser-integration:
    name: Real Chromium · Playwright + Selenium
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install browser test tools
        run: |
          python -m pip install --upgrade pip pytest selenium playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Make Chromium available to local-only browser tests
        shell: bash
        run: |
          chromium_bin="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -perm -111 | head -n 1)"
          test -n "$chromium_bin"
          sudo ln -sf "$chromium_bin" /usr/bin/chromium
          /usr/bin/chromium --version
      - name: Run local Playwright, Selenium, and GUI Chromium tests
        run: xvfb-run -a python -m pytest -q tests/test_browser_automation_local.py tests/test_gui_chromium_local.py
        env:
          BOT_GUARD_RUN_GUI_TESTS: "1"

  package:
    name: Build, validate, and install distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Install wheel into a clean target
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/wheel" dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/wheel" python -c "import bot_guard; assert bot_guard.__version__ == '0.7.0'; print('wheel import OK:', bot_guard.__version__)"
      - name: Install source distribution into a clean target
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/sdist" dist/*.tar.gz
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/sdist" python -c "import bot_guard; assert bot_guard.__version__ == '0.7.0'; print('sdist import OK:', bot_guard.__version__)"
      - name: Store built distributions
        uses: actions/upload-artifact@v4
        with:
          name: bot-guard-py-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
